# ESPHome firmware for the Petkit Fresh Element Mini ("Feedermini") feeder,
# replacing the stock ESP8266 cloud firmware for fully local Home Assistant
# control. The ESP8266 talks to the on-board Nuvoton ISD91230 Cortex-M0 over its
# hardware UART; the M0 still does all motor driving, door control and sensing.
#
# ---- Wiring on the ESP8266 (from petkit-serial-bus reverse engineering) ----
#   GPIO1  U0TXD  -> ISD91230 RX   (bus TX)
#   GPIO3  U0RXD  <- ISD91230 TX   (bus RX)
#   GPIO15        -> ISD91230 reset (low = running; must be low at boot anyway)
#   GPIO0         -> "wifi reset" pushbutton (also flash/boot pin)
#   GPIO13        -> "manual feed" pushbutton
#   GPIO5  SDA / GPIO14 SCL -> PCF8563 RTC (optional, not used here)
#   GPIO16        -> deep-sleep wake (unused here)
#
# ---- Flashing notes ----
# GPIO1/GPIO3 are shared with the M0. Flash the ESP8266 via the exposed debug
# header; hold the M0 in reset (GPIO15 high) or power it down while flashing so
# it does not talk on the bus. After the first serial flash, use OTA.

substitutions:
  name: petkit-feeder
  friendly_name: Petkit Feeder

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp8266:
  # ESP-WROOM-02, 2 MB flash (the stock module). Gives room for OTA.
  board: esp_wroom_02
  restore_from_flash: true

# The bus lives on UART0 (GPIO1/GPIO3), so serial logging MUST be disabled to
# avoid corrupting it. Logs are still available over the network / HA.
logger:
  baud_rate: 0
  level: INFO

# Pull the external component from the local components/ folder in this repo.
external_components:
  - source:
      type: local
      path: components

api:
  # Feed will keep working with no network, but expose it to HA when present.
  # Optional: uncomment to require an encryption key.
  # encryption:
  #   key: !secret api_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Offline-first appliance: never reboot just because Wi-Fi is down. ESPHome's
  # default reboot_timeout (15 min) would power-cycle the feeder during an
  # outage — exactly when it must keep honoring the manual-feed button.
  reboot_timeout: 0s
  ap:
    ssid: "${friendly_name} Fallback"

captive_portal:

# --- UART to the ISD91230 motor/sensor co-processor ---
uart:
  id: bus
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 115200
  # 8N1 is the default and is what the M0 uses.

# --- The Petkit bus master component ---
petkit_feeder:
  id: feeder
  uart_id: bus
  # reset_pin drives GPIO15 = the ISD91230 reset line. Polarity (active-high,
  # low = running) is REASONED from the ESP8266 boot strap requiring GPIO15 low
  # while the M0 is observed running from power-on, but NOT verified on a meter.
  # Getting it wrong holds the M0 in reset (feeder dead). Left commented out;
  # enable only once you have confirmed the polarity on your unit.
  # reset_pin:
  #   number: GPIO15
  #   inverted: false
  send_init_sequence: true
  update_interval: 10s
  # Diagnostic status fields. Names reflect what is actually evidenced; the raw
  # pairs have UNCONFIRMED units/scaling (see README). food/door byte meanings
  # and polarity are from the earlynerd notes and not verified here.
  food_ok:
    name: "Food level (byte0 != 0)"
  door_flag:
    name: "Door status flag (byte1)"
  adapter_raw_1:
    name: "Adapter field 1 (raw)"
  adapter_raw_2:
    name: "Adapter field 2 (raw)"
  battery_raw_1:
    name: "Battery field 1 (raw)"
  battery_raw_2:
    name: "Battery field 2 (raw)"

# --- Physical buttons on the feeder ---
binary_sensor:
  - platform: gpio
    name: "Manual feed button"
    pin:
      number: GPIO13
      inverted: true          # pressed = low
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 30ms
    on_press:
      # Local, cloud-free feed the moment the button is pressed.
      then:
        - lambda: 'id(feeder).feed((uint8_t) id(feed_portions).state);'

  - platform: gpio
    name: "Wifi/reset button"
    pin:
      number: GPIO0
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 30ms

# --- How many "portions" (short dispense turns) one feed does ---
number:
  - platform: template
    id: feed_portions
    name: "Feed portions"
    optimistic: true
    restore_value: true
    initial_value: 2
    min_value: 1
    max_value: 12
    step: 1
    mode: box

# --- Controls exposed to Home Assistant ---
button:
  - platform: template
    name: "Feed now"
    icon: "mdi:bowl-mix"
    on_press:
      - lambda: 'id(feeder).feed((uint8_t) id(feed_portions).state);'

  - platform: template
    name: "Dispense 1 portion"
    on_press:
      - lambda: 'id(feeder).feed(1);'

  - platform: template
    name: "Open door"
    entity_category: config
    on_press:
      # Stock open-door command payload is a single byte 0x1E (the default).
      - lambda: 'id(feeder).open_door();'

  - platform: template
    name: "Close door"
    entity_category: config
    on_press:
      - lambda: 'id(feeder).close_door();'

  - platform: template
    name: "Beep"
    entity_category: config
    on_press:
      - lambda: 'id(feeder).beep(100, 200, 3);'

  - platform: template
    name: "Refresh status"
    entity_category: diagnostic
    on_press:
      - lambda: 'id(feeder).get_status();'

  - platform: template
    name: "Reset motor controller"
    entity_category: diagnostic
    icon: "mdi:restart-alert"
    on_press:
      - lambda: 'id(feeder).reset_mcu();'
