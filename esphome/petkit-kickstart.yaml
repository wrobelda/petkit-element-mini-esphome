# Minimal transition firmware for installing ESPHome through the stock Petkit
# OTA mechanism. This image must not operate the feeder hardware. In
# particular, it does not configure GPIO1/GPIO3 (the motor-controller UART),
# GPIO13 (manual feed), or GPIO15 (active-low motor-controller reset).

substitutions:
  name: petkit-feeder
  friendly_name: Petkit Feeder

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.9.0b1
  project:
    name: petkit.fresh-element-mini-kickstart
    version: "0.1"

# Advertise the final feeder configuration so ESPHome Device Builder can
# discover this bridge, take control of it, and install the feeder firmware
# over the network once the bridge has converted to the eboot layout.
dashboard_import:
  package_import_url: github://wrobelda/petkit-element-mini-esphome/esphome/petkit-feeder.yaml@master

esp8266:
  board: esp_wroom_02
  restore_from_flash: false

# Safe mode starts the native OTA listener before the transition component can
# gate it, so the vendor layout would be exposed to a normal ESPHome upload.
safe_mode:
  disabled: true

# Keep normal diagnostics off UART0 because GPIO1/GPIO3 connect to the feeder's
# motor-controller bus. ESP8266 UART1 is transmit-only on GPIO2.
logger:
  baud_rate: 115200
  hardware_uart: UART1
  level: INFO

external_components:
  - source:
      type: local
      path: !env_var KICKSTART_COMPONENTS_PATH
    components:
      - hub_api
      - esp8266_nonos_v2_slot_control
      - esp8266_nonos_v2_to_eboot_v1

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
  ap:
    ssid: "Petkit Kickstart"
    password: !secret fallback_ap_password

web_server:
  port: 80
  local: true
  ota: false
  auth:
    type: digest
    username: !secret kickstart_web_username
    password: !secret kickstart_web_password

api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_key

# The OTA listener is suppressed while the V2 layout is active (ota_id below)
# and starts normally once the bridge has converted to eboot. Uploads use the
# native API encryption key, so the installer or Device Builder can install the
# final firmware without a separate OTA credential.
ota:
  - platform: esphome
    id: native_ota
    encryption:

esp8266_nonos_v2_to_eboot_v1:
  id: migration
  # Link the bridge for the flash mapping expected by the stock bootloader.
  irom_vma: 0x40201010
  irom_size: 0x0FEFF0
  flash_size: 0x200000
  slots:
    - offset: 0x001000
      size: 0x100000
    - offset: 0x101000
      # Stop before the PHY-data sector at 0x1FB000.
      size: 0x0FA000
  # Reference the `ota: platform: esphome` instance above by id. While the V2
  # layout is active the bridge calls mark_failed() on that component before
  # its setup, so its listener never binds; after the conversion reboot the
  # component is rebuilt and the listener starts normally.
  ota_id: native_ota

hub_api:

esp8266_nonos_v2_slot_control:
  id: slot_control
  # The installer or the Web UI performs relocation and conversion explicitly.
  auto_copy_lower_to_upper_slot: false

button:
  - platform: restart
    name: Restart
    entity_category: diagnostic
  - platform: template
    name: "Convert bridge to eboot layout"
    entity_category: diagnostic
    on_press:
      - lambda: id(migration)->request_conversion();
  - platform: template
    name: "Switch to other slot"
    entity_category: diagnostic
    on_press:
      - lambda: id(slot_control)->request_boot_other();
  - platform: template
    name: "Relocate to upper slot"
    entity_category: diagnostic
    on_press:
      - lambda: id(slot_control)->request_copy_lower_to_upper();

debug:
  update_interval: 10s

sensor:
  - platform: uptime
    name: Uptime
    entity_category: diagnostic
  - platform: debug
    free:
      name: Free heap
    loop_time:
      name: Loop time

text_sensor:
  - platform: debug
    device:
      name: Device information
    reset_reason:
      name: Reset reason
  - platform: wifi_info
    ip_address:
      name: IP address
  - platform: template
    name: "Layout type"
    entity_category: diagnostic
    update_interval: 5min
    lambda: |-
      char buf[160];
      if (id(migration)->layout_is_eboot()) {
        snprintf(buf, sizeof(buf), "eboot V1");
      } else {
        snprintf(buf, sizeof(buf),
                 "V2, slot %u (%s) entry 0x%08X, other slot %s entry 0x%08X",
                 id(slot_control)->active_slot_number(),
                 id(slot_control)->active_slot_valid() ? "valid" : "invalid",
                 id(slot_control)->active_slot_entry(),
                 id(slot_control)->inactive_slot_valid() ? "valid" : "invalid",
                 id(slot_control)->inactive_slot_entry());
      }
      return { buf };
